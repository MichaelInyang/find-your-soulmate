<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="assets/style.css" rel="stylesheet">
</head>

<body>
    <header>

        <div class="logo">
            <div>
                <a href="/">
                    <img src="website-logo.png" height="50px" width="50px">
                </a>
            </div>
            <h2 class="logo-title">Find your Soulmate</h2>

        </div>

    </header>
    <div id="login-section">
        <form>
            <h1>WELCOME BACK!</h1>
            <div>
            <div><label for="login-username">Username:</label>
            </div>
            <div>
                <input type="text" id="login-username">
            </div>
            </div>
            <div>
            <div><label for="login-password">Password:</label>
            </div>
            <div>
                <input type="password" id="login-password">
            </div>
            </div>
            <div>
                <p><a href="forgot.html">Forgot password?</a></p>
            </div>
            <div>
                <input type="submit" value="Login" id="login-button">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
                
            </div>
        </form>
    </div>
    <footer>
        
    </footer>
</body>

</html>
